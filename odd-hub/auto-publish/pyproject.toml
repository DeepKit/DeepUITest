[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odd-auto-publish"
version = "0.1.0"
description = "ODD 多平台自动发布工具"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.scripts]
odd-publish = "auto_publish.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_publish"]


[tool.pytest.ini_options]
pythonpath = ["src"]