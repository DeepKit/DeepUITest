id: config_loader
name: 配置加载器契约
description: 应用配置读取模块的基础契约
verification_hints:
  must_contain_any:
    - patterns: ["config", "Config", "settings", "Settings", "env", "environ"]
      reason: 必须引用配置或环境变量
      severity: critical
  must_not_contain:
    - patterns: ["password =", "secret =", "api_key =", "token =", "SECRET_KEY ="]
      reason: 禁止在配置加载器中硬编码敏感值
      severity: critical
    - patterns: ["eval(", "exec("]
      reason: 禁止动态执行配置内容
      severity: critical
  should_contain:
    - patterns: ["os.environ", "getenv", "dotenv", "load_dotenv", "process.env"]
      reason: 建议从环境变量读取敏感配置
      severity: high
    - patterns: ["default", "fallback", "or ", "if not"]
      reason: 建议为配置项提供默认值
      severity: medium
    - patterns: ["validate", "assert", "raise", "ValueError", "required"]
      reason: 建议校验必填配置项是否存在
      severity: high
