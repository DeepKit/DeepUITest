id: rest_api_endpoint
name: REST API 端点契约
description: HTTP REST API 端点的基础契约
verification_hints:
  must_contain_any:
    - patterns: ["@app.route", "@router.", "app.get(", "app.post(", "app.put(", "app.delete(", "@Get(", "@Post(", "@Put(", "@Delete("]
      reason: 必须包含路由/端点定义
      severity: critical
  must_not_contain:
    - patterns: ["eval(", "exec("]
      reason: 禁止使用 eval/exec
      severity: critical
    - patterns: ["SELECT *", "select *"]
      reason: 禁止 SELECT * 查询
      severity: high
  should_contain:
    - patterns: ["try", "except", "catch", "error"]
      reason: 建议添加错误处理
      severity: high
    - patterns: ["status_code", "status", "HTTPStatus", "http.StatusOK"]
      reason: 建议明确返回 HTTP 状态码
      severity: medium
    - patterns: ['"""', "'''", "//", "/**"]
      reason: 建议添加文档注释
      severity: low
