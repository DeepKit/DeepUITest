<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="instGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="700" fill="#fafafa"/>
  
  <!-- 标题 -->
  <rect x="50" y="20" width="800" height="50" rx="8" fill="url(#headerGrad)"/>
  <text x="450" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="white">总导演约束体系 · Director Constraint System</text>
  
  <!-- 核心问题 -->
  <rect x="50" y="85" width="800" height="35" rx="6" fill="#fef3c7"/>
  <text x="450" y="108" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#92400e">核心问题：谁来监督监督者？如何确保总导演优秀履行职责？</text>
  
  <!-- 三大类别 -->
  <!-- 制度约束 -->
  <rect x="50" y="140" width="260" height="40" rx="6" fill="url(#instGrad)"/>
  <text x="180" y="166" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">制度约束 Institutional</text>
  
  <!-- 透明执行 -->
  <rect x="320" y="140" width="260" height="40" rx="6" fill="url(#transGrad)"/>
  <text x="450" y="166" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">透明执行 Transparent</text>
  
  <!-- 事后审计 -->
  <rect x="590" y="140" width="260" height="40" rx="6" fill="url(#auditGrad)"/>
  <text x="720" y="166" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">事后审计 Post-Audit</text>
  
  <!-- 约束1：流程剧本不可篡改 -->
  <rect x="50" y="195" width="260" height="130" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="195" width="260" height="35" rx="10" fill="#3b82f6"/>
  <text x="180" y="218" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">① 流程剧本不可篡改</text>
  <text x="70" y="250" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">Immutable Playbook</text>
  <text x="70" y="275" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 总导演只能按剧本执行</text>
  <text x="70" y="293" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 流程定义是编译时常量</text>
  <text x="70" y="311" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 运行时只读，不能改剧本</text>
  
  <!-- 约束2：必经关卡不可跳过 -->
  <rect x="50" y="340" width="260" height="130" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="340" width="260" height="35" rx="10" fill="#3b82f6"/>
  <text x="180" y="363" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">② 必经关卡不可跳过</text>
  <text x="70" y="395" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">Mandatory Checkpoints</text>
  <text x="70" y="420" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 守卫检查是硬编码的</text>
  <text x="70" y="438" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 验证调用嵌入代码结构</text>
  <text x="70" y="456" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 不是if判断，是必经函数</text>
  
  <!-- 约束3：权限边界硬隔离 -->
  <rect x="50" y="485" width="260" height="130" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="485" width="260" height="35" rx="10" fill="#3b82f6"/>
  <text x="180" y="508" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">③ 权限边界硬隔离</text>
  <text x="70" y="540" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">Hard Permission Boundary</text>
  <text x="70" y="565" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 只能协调，不能直接操作</text>
  <text x="70" y="583" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 接口隔离，无直接访问权</text>
  <text x="70" y="601" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 不能直接访问数据库/LLM</text>
  
  <!-- 约束4：执行轨迹全记录 -->
  <rect x="320" y="195" width="260" height="130" rx="10" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="195" width="260" height="35" rx="10" fill="#10b981"/>
  <text x="450" y="218" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">④ 执行轨迹全记录</text>
  <text x="340" y="250" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">Complete Execution Trail</text>
  <text x="340" y="275" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 每个决策都记录原因</text>
  <text x="340" y="293" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 自动写入审计日志</text>
  <text x="340" y="311" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 可追溯，任何人可审查</text>
  
  <!-- 约束5：监工独立监控 -->
  <rect x="590" y="195" width="260" height="130" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="590" y="195" width="260" height="35" rx="10" fill="#8b5cf6"/>
  <text x="720" y="218" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">⑤ 监工独立监控</text>
  <text x="610" y="250" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">Independent Supervisor</text>
  <text x="610" y="275" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 监工与总导演平级</text>
  <text x="610" y="293" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 独立观察，不受指挥</text>
  <text x="610" y="311" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 紧急时可绕过总导演</text>
  
  <!-- 约束6：用户最终裁决权 -->
  <rect x="590" y="340" width="260" height="130" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="590" y="340" width="260" height="35" rx="10" fill="#8b5cf6"/>
  <text x="720" y="363" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">⑥ 用户最终裁决权</text>
  <text x="610" y="395" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#334155">User Final Authority</text>
  <text x="610" y="420" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 用户可否决任何结果</text>
  <text x="610" y="438" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 可要求完全重来</text>
  <text x="610" y="456" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">• 可随时回滚到之前状态</text>
  
  <!-- 中间图示 -->
  <rect x="320" y="340" width="260" height="275" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#334155">约束关系示意</text>
  
  <!-- 总导演框 -->
  <rect x="370" y="390" width="160" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">总导演</text>
  
  <!-- 剧本框 -->
  <rect x="340" y="460" width="80" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="485" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#1d4ed8">剧本📜</text>
  <text x="380" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">只读</text>
  
  <!-- 守卫框 -->
  <rect x="480" y="460" width="80" height="40" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="520" y="485" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#92400e">守卫🔒</text>
  <text x="520" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">必经</text>
  
  <!-- 日志框 -->
  <rect x="340" y="520" width="80" height="40" rx="5" fill="#d1fae5" stroke="#10b981"/>
  <text x="380" y="545" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#059669">日志📝</text>
  <text x="380" y="505" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">全记录</text>
  
  <!-- 监工框 -->
  <rect x="480" y="520" width="80" height="40" rx="5" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="520" y="545" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#6d28d9">监工👁</text>
  <text x="520" y="505" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">独立</text>
  
  <!-- 用户框 -->
  <rect x="410" y="575" width="80" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="600" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#15803d">用户👤</text>
  <text x="450" y="560" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">最终裁决</text>
  
  <!-- 底部总结 -->
  <rect x="50" y="635" width="800" height="50" rx="8" fill="#1e293b"/>
  <text x="450" y="658" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="white">总导演的权力来自规则，受规则约束，在透明中执行，被多方监督</text>
  <text x="450" y="676" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Director's power comes from rules, constrained by rules, executed transparently, supervised by multiple parties</text>
</svg>
