<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="550" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">质量监督三方模型</text>
  <text x="400" y="58" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Three-Party Quality Supervision Model</text>
  
  <!-- 用户输入 -->
  <rect x="325" y="80" width="150" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0369a1">用户输入</text>
  
  <path d="M 400 120 L 400 155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 三方监督区域 -->
  <!-- AI监督员 -->
  <rect x="50" y="165" width="220" height="200" rx="12" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <text x="160" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="white">AI监督员</text>
  <text x="160" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)">AI Supervisor</text>
  
  <rect x="65" y="230" width="190" height="120" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="80" y="255" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="white">负责：内容质量</text>
  <text x="80" y="280" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 自检Prompt审查</text>
  <text x="80" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 发现问题自我修正</text>
  <text x="80" y="320" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 完整性、正确性检查</text>
  <text x="80" y="345" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">特点：柔性 · 智能 · 可能漏检</text>
  
  <!-- 系统守卫 -->
  <rect x="290" y="165" width="220" height="200" rx="12" fill="url(#sysGrad)" filter="url(#shadow)"/>
  <text x="400" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="white">系统守卫 🔒</text>
  <text x="400" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)">System Guardian</text>
  
  <rect x="305" y="230" width="190" height="120" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="320" y="255" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="white">负责：格式/安全</text>
  <text x="320" y="280" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• Schema验证</text>
  <text x="320" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 程序化检查</text>
  <text x="320" y="320" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 不通过则拒绝</text>
  <text x="320" y="345" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">特点：硬性 · 可靠 · 不可绕过</text>
  
  <!-- 用户裁判 -->
  <rect x="530" y="165" width="220" height="200" rx="12" fill="url(#userGrad)" filter="url(#shadow)"/>
  <text x="640" y="195" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="white">用户裁判</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)">User Judge</text>
  
  <rect x="545" y="230" width="190" height="120" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="560" y="255" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="white">负责：最终满意度</text>
  <text x="560" y="280" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 确认界面决策</text>
  <text x="560" y="300" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 决定是否接受</text>
  <text x="560" y="320" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">• 可否决任何结果</text>
  <text x="560" y="345" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">特点：最终权威 · 不过度打扰</text>
  
  <!-- 连接箭头 -->
  <path d="M 270 265 L 290 265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 265 L 530 265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 工作流程 -->
  <rect x="50" y="390" width="700" height="140" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#334155">质量监督工作流程</text>
  
  <!-- 流程步骤 -->
  <rect x="70" y="435" width="140" height="70" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="140" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#6d28d9">AI生成+自检</text>
  <text x="140" y="480" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#7c3aed">生成→自检→修正</text>
  <text x="140" y="495" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#a78bfa">发现问题则重新生成</text>
  
  <path d="M 210 470 L 250 470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="260" y="435" width="140" height="70" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="330" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">系统守卫检查</text>
  <text x="330" y="480" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#ef4444">Schema→语法→安全</text>
  <text x="330" y="495" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#f87171">不通过→重生成/自动修复</text>
  
  <path d="M 400 470 L 440 470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="460" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#10b981">全部通过</text>
  
  <rect x="450" y="435" width="140" height="70" rx="6" fill="#dcfce7" stroke="#10b981"/>
  <text x="520" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="#15803d">用户确认</text>
  <text x="520" y="480" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#16a34a">展示理解+预览结果</text>
  <text x="520" y="495" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="8" fill="#22c55e">确认/调整/重来</text>
  
  <path d="M 590 470 L 630 470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <ellipse cx="690" cy="470" rx="40" ry="25" fill="#10b981"/>
  <text x="690" y="475" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="bold" fill="white">输出</text>
  
  <!-- 关键原则 -->
  <rect x="50" y="510" width="700" height="30" rx="5" fill="#1e293b"/>
  <text x="400" y="530" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="white">
    AI不信任自己 · 系统不信任AI · 用户不需要懂技术 · 宁可降级不可出错
  </text>
</svg>
