<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <defs>
    <linearGradient id="directorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="supervisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
    <linearGradient id="capabilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#0abde3"/>
    </linearGradient>
    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5f27cd"/>
      <stop offset="100%" style="stop-color:#341f97"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="750" fill="#f1f5f9"/>
  
  <!-- 标题 -->
  <text x="500" y="35" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">后台角色架构 · Runtime Role Architecture</text>
  
  <!-- 用户 -->
  <ellipse cx="500" cy="95" rx="60" ry="30" fill="#10b981" filter="url(#shadow)"/>
  <text x="500" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">用户 User</text>
  
  <!-- 连接线：用户到总导演 -->
  <path d="M 500 125 L 500 155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  
  <!-- 总导演 -->
  <rect x="350" y="160" width="300" height="90" rx="12" fill="url(#directorGrad)" filter="url(#shadow)"/>
  <text x="500" y="190" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="white">总导演/调度员</text>
  <text x="500" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.9)">Director / Orchestrator</text>
  <text x="500" y="235" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">运行时总指挥 · 无AI · 纯程序逻辑</text>
  
  <!-- 监工（与总导演平级） -->
  <rect x="700" y="170" width="140" height="70" rx="10" fill="url(#supervisorGrad)" filter="url(#shadow)"/>
  <text x="770" y="198" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="white">监工</text>
  <text x="770" y="216" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)">Supervisor</text>
  <text x="770" y="232" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">独立观察 · 平级制衡</text>
  
  <!-- 平级关系线 -->
  <line x1="650" y1="205" x2="700" y2="205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="675" y="200" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#64748b">平级</text>
  
  <!-- 发号施令箭头 -->
  <path d="M 430 250 L 280 300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 250 L 500 300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 570 250 L 720 300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="285" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">发号施令</text>
  
  <!-- 三大类别标签 -->
  <!-- 能力执行类 -->
  <rect x="50" y="305" width="300" height="30" rx="5" fill="#0891b2"/>
  <text x="200" y="325" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">能力执行类 Capability Execution</text>
  
  <!-- 质量守护类 -->
  <rect x="370" y="305" width="260" height="30" rx="5" fill="#7c3aed"/>
  <text x="500" y="325" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">质量守护类 Quality Assurance</text>
  
  <!-- 保障类 -->
  <rect x="650" y="305" width="200" height="30" rx="5" fill="#ea580c"/>
  <text x="750" y="325" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="white">保障类 Support</text>
  
  <!-- AI代理 -->
  <rect x="50" y="350" width="140" height="100" rx="10" fill="url(#capabilityGrad)" filter="url(#shadow)"/>
  <text x="120" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">AI代理</text>
  <text x="120" y="398" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">AI Agent</text>
  <rect x="60" y="408" width="120" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="120" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">意图理解·内容生成</text>
  <text x="120" y="436" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">🤖 需要AI</text>
  
  <!-- 共情官 -->
  <rect x="210" y="350" width="140" height="100" rx="10" fill="url(#capabilityGrad)" filter="url(#shadow)"/>
  <text x="280" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">共情官</text>
  <text x="280" y="398" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Empathy Agent</text>
  <rect x="220" y="408" width="120" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="280" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">情感感知·体验优化</text>
  <text x="280" y="436" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">🤖 需要AI</text>
  
  <!-- 记忆官 -->
  <rect x="50" y="470" width="140" height="100" rx="10" fill="url(#capabilityGrad)" filter="url(#shadow)"/>
  <text x="120" y="500" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">记忆官</text>
  <text x="120" y="518" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Memory Keeper</text>
  <rect x="60" y="528" width="120" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="120" y="542" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">上下文·历史管理</text>
  <text x="120" y="556" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">🤖 Embedding</text>
  
  <!-- 守卫员 -->
  <rect x="370" y="350" width="120" height="100" rx="10" fill="url(#qualityGrad)" filter="url(#shadow)"/>
  <text x="430" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">守卫员</text>
  <text x="430" y="398" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Guardian</text>
  <rect x="378" y="408" width="104" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="430" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">格式·安全验证</text>
  <text x="430" y="436" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#f87171">🔒 硬关卡</text>
  
  <!-- 自检员 -->
  <rect x="510" y="350" width="120" height="100" rx="10" fill="url(#qualityGrad)" filter="url(#shadow)"/>
  <text x="570" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">自检员</text>
  <text x="570" y="398" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Self-Checker</text>
  <rect x="518" y="408" width="104" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="570" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">AI输出自审</text>
  <text x="570" y="436" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">🤖 需要AI</text>
  
  <!-- 比对员 -->
  <rect x="370" y="470" width="120" height="100" rx="10" fill="url(#qualityGrad)" filter="url(#shadow)"/>
  <text x="430" y="500" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">比对员</text>
  <text x="430" y="518" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Diff Analyzer</text>
  <rect x="378" y="528" width="104" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="430" y="542" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">变更影响分析</text>
  <text x="430" y="556" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fef08a">🤖 代码LLM</text>
  
  <!-- 回滚员 -->
  <rect x="650" y="350" width="140" height="100" rx="10" fill="url(#supervisorGrad)" filter="url(#shadow)"/>
  <text x="720" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="white">回滚员</text>
  <text x="720" y="398" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.9)">Rollback Agent</text>
  <rect x="660" y="408" width="120" height="35" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="720" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="white">故障恢复·状态回滚</text>
  <text x="720" y="436" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#bbf7d0">✓ 无需AI</text>
  
  <!-- 汇报箭头 -->
  <path d="M 120 570 L 120 620 L 450 620 L 450 600" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 450 L 280 620" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 430 570 L 430 620" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 570 450 L 570 620 L 450 620" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 720 450 L 720 620 L 450 620" stroke="#64748b" stroke-width="1.5" fill="none"/>
  
  <!-- 汇报汇总框 -->
  <rect x="380" y="600" width="140" height="35" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="622" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#475569">向总导演汇报</text>
  
  <!-- 图例 -->
  <rect x="50" y="670" width="900" height="70" rx="10" fill="white" stroke="#e2e8f0"/>
  <text x="70" y="695" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#334155">图例 Legend:</text>
  
  <rect x="160" y="683" width="20" height="14" rx="3" fill="url(#directorGrad)"/>
  <text x="185" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">流程控制</text>
  
  <rect x="280" y="683" width="20" height="14" rx="3" fill="url(#capabilityGrad)"/>
  <text x="305" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">能力执行</text>
  
  <rect x="400" y="683" width="20" height="14" rx="3" fill="url(#qualityGrad)"/>
  <text x="425" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">质量守护</text>
  
  <rect x="520" y="683" width="20" height="14" rx="3" fill="url(#supervisorGrad)"/>
  <text x="545" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">保障支持</text>
  
  <text x="650" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">🤖 = 需要AI</text>
  <text x="760" y="695" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#475569">🔒 = 硬关卡不可绕过</text>
  
  <text x="500" y="725" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#64748b">AI归AI、程序归程序 · 需要智能的用AI，需要可靠的用程序</text>
</svg>
