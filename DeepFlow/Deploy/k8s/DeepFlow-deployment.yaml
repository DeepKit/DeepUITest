apiVersion: v1
kind: Namespace
metadata:
  name: uniflow
  labels:
    app: uniflow
    env: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uniflow-config
  namespace: uniflow
data:
  # 应用配置
  app.config: |
    [Application]
    Name=UniFlow
    Version=1.0.0
    Environment=Production
    
    [Server]
    Host=0.0.0.0
    Port=8080
    WorkerThreads=8
    MaxConnections=10000
    
    [Workflow]
    MaxConcurrent=1000
    DefaultTimeout=300
    RetryAttempts=3
    RetryBackoff=exponential
    
    [Storage]
    Backend=PostgreSQL
    MigrateOnStartup=true
    ConnectionPoolSize=20
    
    [Cache]
    Backend=Redis
    TTL=3600
    MaxMemory=2GB
    
    [Queue]
    Backend=RabbitMQ
    PrefetchCount=10
    AutoAck=false
    
    [Monitoring]
    Enabled=true
    MetricsPort=9090
    HealthCheckPath=/health
    ReadinessPath=/ready
    LivenessPath=/live
    
    [Tracing]
    Enabled=true
    Exporter=OTLP
    SamplingRate=0.1
    
    [Security]
    JWTSecret=${JWT_SECRET}
    TokenExpiry=24h
    RateLimitRPS=1000

---
apiVersion: v1
kind: Secret
metadata:
  name: uniflow-secrets
  namespace: uniflow
type: Opaque
stringData:
  # 数据库凭证
  db-host: postgres.uniflow.svc.cluster.local
  db-port: "5432"
  db-name: uniflow
  db-user: uniflow_user
  db-password: CHANGE_ME_IN_PRODUCTION
  
  # Redis 凭证
  redis-host: redis.uniflow.svc.cluster.local
  redis-port: "6379"
  redis-password: CHANGE_ME_IN_PRODUCTION
  
  # RabbitMQ 凭证
  rabbitmq-host: rabbitmq.uniflow.svc.cluster.local
  rabbitmq-port: "5672"
  rabbitmq-user: uniflow_user
  rabbitmq-password: CHANGE_ME_IN_PRODUCTION
  
  # JWT Secret
  jwt-secret: CHANGE_ME_GENERATE_RANDOM_SECRET
  
  # API Keys
  openai-api-key: ""
  anthropic-api-key: ""
  google-api-key: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniflow
  namespace: uniflow
  labels:
    app: uniflow
    component: api
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: uniflow
      component: api
  template:
    metadata:
      labels:
        app: uniflow
        component: api
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: uniflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z ${DB_HOST} ${DB_PORT}; do
            echo "Waiting for database..."
            sleep 2
          done
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-port
      
      - name: migrate-db
        image: uniflow/api:1.0.0
        command: ["/app/migrate"]
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-password
      
      containers:
      - name: uniflow
        image: uniflow/api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        # 数据库配置
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: db-password
        
        # Redis 配置
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: redis-password
        
        # RabbitMQ 配置
        - name: RABBITMQ_HOST
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: rabbitmq-host
        - name: RABBITMQ_PORT
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: rabbitmq-port
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: rabbitmq-user
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: rabbitmq-password
        
        # JWT Secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: jwt-secret
        
        # LLM API Keys
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: anthropic-api-key
              optional: true
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: uniflow-secrets
              key: google-api-key
              optional: true
        
        volumeMounts:
        - name: config
          mountPath: /etc/uniflow
          readOnly: true
        - name: cache
          mountPath: /var/cache/uniflow
        - name: logs
          mountPath: /var/log/uniflow
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: config
        configMap:
          name: uniflow-config
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - uniflow
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: uniflow
  namespace: uniflow
  labels:
    app: uniflow
    component: api
spec:
  type: ClusterIP
  selector:
    app: uniflow
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: uniflow-headless
  namespace: uniflow
  labels:
    app: uniflow
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: uniflow
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uniflow
  namespace: uniflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uniflow
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uniflow
  namespace: uniflow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: uniflow
      component: api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uniflow
  namespace: uniflow
  labels:
    app: uniflow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uniflow
  namespace: uniflow
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uniflow
  namespace: uniflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uniflow
subjects:
- kind: ServiceAccount
  name: uniflow
  namespace: uniflow

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uniflow
  namespace: uniflow
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  tls:
  - hosts:
    - uniflow.example.com
    secretName: uniflow-tls
  rules:
  - host: uniflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uniflow
            port:
              name: http

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uniflow-data
  namespace: uniflow
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
