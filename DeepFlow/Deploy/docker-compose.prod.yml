# UniFlow Production Docker Compose
# TASK-2003: 生产部署脚本
#
# 使用方法:
#   docker-compose -f docker-compose.prod.yml up -d
#
# 环境变量:
#   - 从 .env 文件加载
#   - 或通过 -e 参数传递

version: '3.8'

services:
  # ==========================================================================
  # Python Skills Service
  # ==========================================================================
  skills-python:
    image: uniflow/skills-python:${VERSION:-latest}
    build:
      context: ../Skills
      dockerfile: Dockerfile
    container_name: uniflow-skills-python
    restart: unless-stopped
    ports:
      - "${PYTHON_SKILLS_PORT:-8001}:8000"
    environment:
      - UNIFLOW_ENV=production
      - UNIFLOW_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UNIFLOW_METRICS_ENABLED=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - skills-python-data:/app/data
      - skills-python-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - uniflow-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # Node.js Skills Service
  # ==========================================================================
  skills-nodejs:
    image: uniflow/skills-nodejs:${VERSION:-latest}
    build:
      context: ../Skills/nodejs
      dockerfile: Dockerfile
    container_name: uniflow-skills-nodejs
    restart: unless-stopped
    ports:
      - "${NODEJS_SKILLS_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - UNIFLOW_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - UNIFLOW_METRICS_ENABLED=true
    volumes:
      - skills-nodejs-data:/app/data
      - skills-nodejs-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - uniflow-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: uniflow-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - skills-python
      - skills-nodejs
    networks:
      - uniflow-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Prometheus Metrics
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: uniflow-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - uniflow-network
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana Dashboard
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: uniflow-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - uniflow-network
    profiles:
      - monitoring

  # ==========================================================================
  # Redis Cache (Optional)
  # ==========================================================================
  redis:
    image: redis:alpine
    container_name: uniflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - uniflow-network
    profiles:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==========================================================================
# Networks
# ==========================================================================
networks:
  uniflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  skills-python-data:
    driver: local
  skills-python-logs:
    driver: local
  skills-nodejs-data:
    driver: local
  skills-nodejs-logs:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  redis-data:
    driver: local
