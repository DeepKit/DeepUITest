{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uniflow.fullname" . }}-api
  labels:
    {{- include "uniflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "uniflow.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.monitoring.metricsPort }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "uniflow.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "uniflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z ${DB_HOST} ${DB_PORT}; do
            echo "Waiting for database..."
            sleep 2
          done
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ include "uniflow.secretName" . }}
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: {{ include "uniflow.secretName" . }}
              key: db-port
      
      containers:
      - name: api
        image: {{ include "uniflow.api.image" . }}
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.server.port }}
          protocol: TCP
        - name: metrics
          containerPort: {{ .Values.config.monitoring.metricsPort }}
          protocol: TCP
        
        env:
        {{- include "uniflow.commonEnv" . | nindent 8 }}
        
        volumeMounts:
        - name: config
          mountPath: /etc/uniflow
          readOnly: true
        - name: cache
          mountPath: /var/cache/uniflow
        - name: logs
          mountPath: /var/log/uniflow
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        
        {{- if .Values.api.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.api.livenessProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
        {{- end }}
        
        {{- if .Values.api.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.api.readinessProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
        {{- end }}
        
        {{- if .Values.api.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.api.startupProbe.path }}
            port: http
          initialDelaySeconds: {{ .Values.api.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
        {{- end }}
        
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
      
      volumes:
      - name: config
        configMap:
          name: {{ include "uniflow.configMapName" . }}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "uniflow.api.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      terminationGracePeriodSeconds: 30
{{- end }}
