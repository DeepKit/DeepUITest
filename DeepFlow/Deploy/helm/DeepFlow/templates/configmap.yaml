apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uniflow.configMapName" . }}
  labels:
    {{- include "uniflow.labels" . | nindent 4 }}
data:
  app.config: |
    [Application]
    Name=UniFlow
    Version={{ .Chart.AppVersion }}
    Environment={{ .Values.global.environment | default "production" }}
    
    [Server]
    Host={{ .Values.config.server.host }}
    Port={{ .Values.config.server.port }}
    WorkerThreads={{ .Values.config.server.workerThreads }}
    MaxConnections={{ .Values.config.server.maxConnections }}
    
    [Workflow]
    MaxConcurrent={{ .Values.config.workflow.maxConcurrent }}
    DefaultTimeout={{ .Values.config.workflow.defaultTimeout }}
    RetryAttempts={{ .Values.config.workflow.retryAttempts }}
    RetryBackoff={{ .Values.config.workflow.retryBackoff }}
    
    [Storage]
    Backend=PostgreSQL
    MigrateOnStartup=true
    ConnectionPoolSize=20
    
    [Cache]
    Backend={{ .Values.config.cache.backend }}
    TTL={{ .Values.config.cache.ttl }}
    MaxMemory={{ .Values.config.cache.maxMemory }}
    
    [Queue]
    Backend={{ .Values.config.queue.backend }}
    PrefetchCount={{ .Values.config.queue.prefetchCount }}
    AutoAck={{ .Values.config.queue.autoAck }}
    
    [Monitoring]
    Enabled={{ .Values.config.monitoring.enabled }}
    MetricsPort={{ .Values.config.monitoring.metricsPort }}
    HealthCheckPath={{ .Values.config.monitoring.healthCheckPath }}
    ReadinessPath={{ .Values.config.monitoring.readinessPath }}
    LivenessPath={{ .Values.config.monitoring.livenessPath }}
    
    [Tracing]
    Enabled={{ .Values.config.tracing.enabled }}
    Exporter={{ .Values.config.tracing.exporter }}
    SamplingRate={{ .Values.config.tracing.samplingRate }}
    Endpoint={{ .Values.config.tracing.endpoint }}
    
    [Security]
    JWTSecret=${JWT_SECRET}
    TokenExpiry={{ .Values.config.security.tokenExpiry }}
    RateLimitRPS={{ .Values.config.security.rateLimitRPS }}
