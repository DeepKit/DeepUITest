apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uniflow.secretName" . }}
  labels:
    {{- include "uniflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  db-host: {{ include "uniflow.database.host" . | quote }}
  db-port: {{ .Values.secrets.database.port | quote }}
  db-name: {{ .Values.secrets.database.name | quote }}
  db-user: {{ .Values.secrets.database.user | quote }}
  {{- if .Values.secrets.database.password }}
  db-password: {{ .Values.secrets.database.password | quote }}
  {{- else if .Values.postgresql.enabled }}
  db-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) | quote }}
  {{- else }}
  db-password: ""
  {{- end }}
  
  # Redis credentials
  redis-host: {{ include "uniflow.redis.host" . | quote }}
  redis-port: {{ .Values.secrets.redis.port | quote }}
  {{- if .Values.secrets.redis.password }}
  redis-password: {{ .Values.secrets.redis.password | quote }}
  {{- else if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) | quote }}
  {{- else }}
  redis-password: ""
  {{- end }}
  
  # RabbitMQ credentials
  rabbitmq-host: {{ include "uniflow.rabbitmq.host" . | quote }}
  rabbitmq-port: {{ .Values.secrets.rabbitmq.port | quote }}
  rabbitmq-user: {{ .Values.secrets.rabbitmq.user | quote }}
  {{- if .Values.secrets.rabbitmq.password }}
  rabbitmq-password: {{ .Values.secrets.rabbitmq.password | quote }}
  {{- else if .Values.rabbitmq.enabled }}
  rabbitmq-password: {{ .Values.rabbitmq.auth.password | default (randAlphaNum 32) | quote }}
  {{- else }}
  rabbitmq-password: ""
  {{- end }}
  
  # JWT Secret
  jwt-secret: {{ .Values.secrets.jwtSecret | default (randAlphaNum 64) | quote }}
  
  # LLM API Keys
  {{- if .Values.secrets.llm.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.llm.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.llm.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.googleApiKey }}
  google-api-key: {{ .Values.secrets.llm.googleApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.azureApiKey }}
  azure-api-key: {{ .Values.secrets.llm.azureApiKey | quote }}
  azure-endpoint: {{ .Values.secrets.llm.azureEndpoint | quote }}
  {{- end }}
