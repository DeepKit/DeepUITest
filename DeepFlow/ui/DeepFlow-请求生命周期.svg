<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>
    .title { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:20px; font-weight:bold; fill:#333; }
    .phase-title { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:14px; font-weight:bold; fill:#fff; }
    .role-name { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:12px; font-weight:bold; fill:#fff; }
    .role-alias { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:9px; fill:rgba(255,255,255,0.7); }
    .action-text { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:10px; fill:#666; }
    .note { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:10px; fill:#888; }
    .arrow { stroke:#666; stroke-width:1.5; marker-end:url(#arrowhead); fill:none; }
    .arrow-success { stroke:#38a3a5; stroke-width:2; marker-end:url(#arrowhead-success); fill:none; }
    .arrow-fail { stroke:#e94560; stroke-width:1.5; stroke-dasharray:5,3; marker-end:url(#arrowhead-fail); fill:none; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
    <marker id="arrowhead-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a3a5" />
    </marker>
    <marker id="arrowhead-fail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- 标题 -->
  <text class="title" x="500" y="35" text-anchor="middle">UniFlow 请求生命周期</text>
  <text class="note" x="500" y="55" text-anchor="middle">从外部请求到最终响应的完整流程</text>

  <!-- 外部请求起点 -->
  <g transform="translate(50, 90)">
    <circle cx="20" cy="20" r="18" fill="#333"/>
    <text x="20" y="25" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#fff">请求</text>
  </g>

  <!-- 阶段1：入口校验 -->
  <g transform="translate(130, 80)">
    <rect width="200" height="90" rx="8" fill="#533483" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">① 入口校验</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">门卫</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">哨兵 | 门禁</text>
  </g>

  <!-- 箭头：请求 -> 门卫 -->
  <line class="arrow" x1="88" y1="110" x2="125" y2="110"/>

  <!-- 校验失败分支 -->
  <g transform="translate(130, 190)">
    <rect width="80" height="35" rx="5" fill="#e94560"/>
    <text x="40" y="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#fff">拒绝</text>
  </g>
  <line class="arrow-fail" x1="230" y1="170" x2="230" y2="185"/>
  <text class="action-text" x="245" y="180">校验失败</text>

  <!-- 阶段2：任务受理 -->
  <g transform="translate(370, 80)">
    <rect width="200" height="90" rx="8" fill="#0f3460" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">② 任务受理</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">总指挥</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">司令官 | 导演</text>
  </g>

  <!-- 箭头：门卫 -> 总指挥 -->
  <line class="arrow-success" x1="330" y1="125" x2="365" y2="125"/>
  <text class="action-text" x="335" y="115">校验通过</text>

  <!-- 阶段3：任务拆解 -->
  <g transform="translate(610, 80)">
    <rect width="200" height="90" rx="8" fill="#0f3460" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">③ 任务拆解</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">调度员</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">参谋 | 副导演</text>
  </g>

  <!-- 箭头：总指挥 -> 调度员 -->
  <line class="arrow" x1="570" y1="125" x2="605" y2="125"/>
  <text class="action-text" x="575" y="115">下达任务</text>

  <!-- 阶段4：智能处理 -->
  <g transform="translate(130, 260)">
    <rect width="200" height="90" rx="8" fill="#c73659" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">④ 智能处理</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">智囊</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">情报官 | 编剧</text>
  </g>

  <!-- 箭头：调度员 -> 智囊 (绕行) -->
  <path class="arrow" d="M 710 170 L 710 210 L 330 210 L 330 255" fill="none"/>
  <text class="action-text" x="520" y="205">分派 AI 任务</text>

  <!-- 军械官支援 -->
  <g transform="translate(130, 370)">
    <rect width="100" height="50" rx="5" fill="#533483" filter="url(#shadow)"/>
    <text class="role-name" x="50" y="25" text-anchor="middle">军械官</text>
    <text class="role-alias" x="50" y="38" text-anchor="middle">道具师</text>
  </g>
  <line class="arrow" x1="180" y1="350" x2="180" y2="365"/>
  <text class="action-text" x="190" y="365">获取Prompt</text>

  <!-- 记录员支援 -->
  <g transform="translate(250, 370)">
    <rect width="100" height="50" rx="5" fill="#2c786c" filter="url(#shadow)"/>
    <text class="role-name" x="50" y="25" text-anchor="middle">记录员</text>
    <text class="role-alias" x="50" y="38" text-anchor="middle">场记</text>
  </g>
  <line class="arrow" x1="300" y1="350" x2="300" y2="365"/>
  <text class="action-text" x="310" y="365">读取记忆</text>

  <!-- 阶段5：技能执行 -->
  <g transform="translate(370, 260)">
    <rect width="200" height="90" rx="8" fill="#533483" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">⑤ 技能执行</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">执行者</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">作战部队 | 摄制组</text>
  </g>

  <!-- 箭头：智囊 -> 执行者 -->
  <line class="arrow" x1="330" y1="305" x2="365" y2="305"/>
  <text class="action-text" x="335" y="295">生成方案</text>

  <!-- 通信官支援 -->
  <g transform="translate(490, 370)">
    <rect width="100" height="50" rx="5" fill="#2c786c" filter="url(#shadow)"/>
    <text class="role-name" x="50" y="25" text-anchor="middle">通信官</text>
    <text class="role-alias" x="50" y="38" text-anchor="middle">信息中心</text>
  </g>
  <line class="arrow" x1="540" y1="350" x2="540" y2="365"/>
  <text class="action-text" x="550" y="365">外部调用</text>

  <!-- 阶段6：过程监控 -->
  <g transform="translate(610, 260)">
    <rect width="200" height="90" rx="8" fill="#533483" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">⑥ 过程监控</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">监工</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">督战队 | 现场监制</text>
  </g>

  <!-- 箭头：执行者 <-> 监工 -->
  <line class="arrow" x1="570" y1="295" x2="605" y2="295"/>
  <line class="arrow" x1="605" y1="315" x2="570" y2="315"/>
  <text class="action-text" x="575" y="285">监控执行</text>

  <!-- 阶段7：出口审核 -->
  <g transform="translate(370, 450)">
    <rect width="200" height="90" rx="8" fill="#533483" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">⑦ 出口审核</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">审核官</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">军法官 | 审片委员会</text>
  </g>

  <!-- 箭头：执行者 -> 审核官 -->
  <path class="arrow" d="M 470 350 L 470 445" fill="none"/>
  <text class="action-text" x="480" y="400">执行结果</text>

  <!-- 审核失败分支 -->
  <g transform="translate(610, 460)">
    <rect width="80" height="35" rx="5" fill="#e94560"/>
    <text x="40" y="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#fff">打回</text>
  </g>
  <line class="arrow-fail" x1="570" y1="495" x2="605" y2="495"/>
  <text class="action-text" x="575" y="515">审核失败</text>

  <!-- 返回修正箭头 -->
  <path class="arrow-fail" d="M 690 478 L 720 478 L 720 305 L 575 305" fill="none"/>
  <text class="action-text" x="725" y="390">重新执行</text>

  <!-- 阶段8：响应输出 -->
  <g transform="translate(130, 450)">
    <rect width="200" height="90" rx="8" fill="#0f3460" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">⑧ 响应输出</text>
    
    <rect x="30" y="35" width="140" height="45" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="55" text-anchor="middle">总指挥</text>
    <text class="role-alias" x="100" y="70" text-anchor="middle">司令官 | 导演</text>
  </g>

  <!-- 箭头：审核官 -> 总指挥 -->
  <line class="arrow-success" x1="365" y1="495" x2="330" y2="495"/>
  <text class="action-text" x="335" y="485">审核通过</text>

  <!-- 最终响应 -->
  <g transform="translate(50, 560)">
    <circle cx="20" cy="20" r="18" fill="#38a3a5"/>
    <text x="20" y="25" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#fff">响应</text>
  </g>
  <line class="arrow-success" x1="130" y1="540" x2="70" y2="565"/>

  <!-- 阶段9：归档记录 -->
  <g transform="translate(130, 560)">
    <rect width="200" height="70" rx="8" fill="#2c786c" filter="url(#shadow)"/>
    <text class="phase-title" x="100" y="20" text-anchor="middle">⑨ 归档记录</text>
    
    <rect x="30" y="30" width="140" height="35" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text class="role-name" x="100" y="52" text-anchor="middle">记录员</text>
  </g>

  <!-- 箭头：总指挥 -> 记录员 -->
  <line class="arrow" x1="230" y1="540" x2="230" y2="555"/>
  <text class="action-text" x="240" y="550">全程记录</text>

  <!-- 督察观测（侧边） -->
  <g transform="translate(870, 150)">
    <rect width="100" height="350" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
    <text class="phase-title" x="50" y="25" text-anchor="middle">督察</text>
    <text class="role-alias" x="50" y="42" text-anchor="middle">总监察长 | 监制</text>
    
    <text class="role-alias" x="50" y="80" text-anchor="middle">状态查看</text>
    <text class="role-alias" x="50" y="130" text-anchor="middle">断点控制</text>
    <text class="role-alias" x="50" y="180" text-anchor="middle">Mock注入</text>
    <text class="role-alias" x="50" y="230" text-anchor="middle">性能剖析</text>
    <text class="role-alias" x="50" y="280" text-anchor="middle">紧急干预</text>
  </g>

  <!-- 督察观测线 -->
  <line x1="865" y1="200" x2="820" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="865" y1="300" x2="820" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="865" y1="400" x2="820" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text class="note" x="835" y="350">观测全流程</text>

  <!-- 图例 -->
  <g transform="translate(50, 650)">
    <text class="note" x="0" y="15" font-weight="bold">图例：</text>
    
    <line class="arrow-success" x1="60" y1="12" x2="100" y2="12"/>
    <text class="note" x="110" y="15">成功流转</text>
    
    <line class="arrow-fail" x1="200" y1="12" x2="240" y2="12"/>
    <text class="note" x="250" y="15">失败/打回</text>
    
    <line class="arrow" x1="340" y1="12" x2="380" y2="12"/>
    <text class="note" x="390" y="15">普通流转</text>
    
    <rect x="480" y="2" width="18" height="18" rx="3" fill="#533483"/>
    <text class="note" x="505" y="15">守卫/能力层</text>
    
    <rect x="600" y="2" width="18" height="18" rx="3" fill="#0f3460"/>
    <text class="note" x="625" y="15">决策层</text>
    
    <rect x="700" y="2" width="18" height="18" rx="3" fill="#c73659"/>
    <text class="note" x="725" y="15">智能层</text>
    
    <rect x="800" y="2" width="18" height="18" rx="3" fill="#2c786c"/>
    <text class="note" x="825" y="15">基础层</text>
  </g>

  <!-- 版权 -->
  <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">UniFlow - 请求生命周期 © 2025</text>
</svg>
