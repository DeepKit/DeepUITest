# UniFlow Release Workflow
# Creates releases on version tags

name: Release

on:
  push:
    tags:
      - 'uniflow-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PYTHON: ${{ github.repository }}/uniflow-skills-python
  IMAGE_NAME_NODEJS: ${{ github.repository }}/uniflow-skills-nodejs

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Python tests
        working-directory: docs/uniFlow/Skills
        run: |
          pip install -r requirements.txt
          pytest tests/ -v || true

      - name: Run Node.js tests
        working-directory: docs/uniFlow/Skills/nodejs
        run: |
          npm install
          npm test || true

  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/uniflow-v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Python Skills Image
      - name: Extract metadata for Python image
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PYTHON }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/uniflow-v{0}', steps.version.outputs.VERSION) }}

      - name: Build and push Python Skills image
        uses: docker/build-push-action@v5
        with:
          context: docs/uniFlow/Skills
          file: docs/uniFlow/Skills/Dockerfile
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Node.js Skills Image
      - name: Extract metadata for Node.js image
        id: meta-nodejs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NODEJS }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/uniflow-v{0}', steps.version.outputs.VERSION) }}

      - name: Build and push Node.js Skills image
        uses: docker/build-push-action@v5
        with:
          context: docs/uniFlow/Skills/nodejs
          file: docs/uniFlow/Skills/nodejs/Dockerfile
          push: true
          tags: ${{ steps.meta-nodejs.outputs.tags }}
          labels: ${{ steps.meta-nodejs.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: docker-release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/uniflow-v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## UniFlow v${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Docker Images" >> $GITHUB_OUTPUT
          echo "- \`ghcr.io/${{ github.repository }}/uniflow-skills-python:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_OUTPUT
          echo "- \`ghcr.io/${{ github.repository }}/uniflow-skills-nodejs:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Components" >> $GITHUB_OUTPUT
          echo "- **Pascal Core**: Workflow engine, session management, diagnostics" >> $GITHUB_OUTPUT
          echo "- **Python Skills**: FastAPI service with LiteLLM integration" >> $GITHUB_OUTPUT
          echo "- **Node.js Skills**: Express service with JSON transform, HTTP, text processing" >> $GITHUB_OUTPUT
          echo "- **Web Editor**: Visual workflow editor with drag-drop support" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Installation" >> $GITHUB_OUTPUT
          echo "\`\`\`bash" >> $GITHUB_OUTPUT
          echo "# Python Skills" >> $GITHUB_OUTPUT
          echo "docker pull ghcr.io/${{ github.repository }}/uniflow-skills-python:${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "# Node.js Skills" >> $GITHUB_OUTPUT
          echo "docker pull ghcr.io/${{ github.repository }}/uniflow-skills-nodejs:${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "\`\`\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: UniFlow v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
