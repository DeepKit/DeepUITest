[project]
name = "inkflow-v2"
version = "0.0.0"
description = "InkFlow v2 production rewrite"
requires-python = ">=3.11"

[project.scripts]
ink = "ink.cli:main"
ink-record-llm-acceptance = "ink.tools.record_llm_acceptance:main"
ink-replay-thresholds = "ink.tools.replay_thresholds:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
