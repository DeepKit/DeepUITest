<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progee Lite · 朋友圈生成器</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0D5C4A;
    --accent: #00E5A0;
    --bg: #F0F4F2;
    --surface: #fff;
    --border: #E0E8E4;
    --text: #0F1F1A;
    --muted: #7A9088;
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --serif: 'Instrument Serif', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── Left Panel ── */
  .panel {
    width: 300px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 20px;
    overflow-y: auto;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 28px; height: 28px;
    background: var(--brand);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    font-weight: 500;
  }
  .panel-title { font-size: 14px; font-weight: 600; }
  .panel-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .control-group { display: flex; flex-direction: column; gap: 8px; }
  .control-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--mono);
  }

  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .option-btn {
    padding: 9px 8px; border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent; font-size: 12px;
    font-family: var(--sans); color: var(--muted);
    cursor: pointer; transition: all 0.15s;
    text-align: left; line-height: 1.3;
  }
  .option-btn:hover { border-color: var(--brand); color: var(--brand); }
  .option-btn.active {
    border-color: var(--brand);
    background: rgba(13,92,74,0.06);
    color: var(--brand); font-weight: 500;
  }
  .opt-icon { display: block; font-size: 15px; margin-bottom: 2px; }

  .text-input {
    width: 100%; padding: 9px 11px;
    border-radius: 8px; border: 1.5px solid var(--border);
    font-family: var(--sans); font-size: 13px;
    color: var(--text); background: #FAFCFB;
    outline: none; transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--brand); }

  .style-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; }
  .style-swatch {
    height: 32px; border-radius: 7px; cursor: pointer;
    border: 2.5px solid transparent; transition: all 0.15s;
  }
  .style-swatch.active {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(13,92,74,0.2);
  }
  .swatch-dark { background: #0D5C4A; }
  .swatch-light { background: linear-gradient(135deg,#F7F9F8,#E8EDEB); border: 1px solid #ddd; }
  .swatch-night { background: #0A0F0E; }
  .swatch-warm { background: linear-gradient(135deg,#1A3C34,#0D5C4A); }

  .divider-line { height: 1px; background: var(--border); }

  .generate-btn {
    width: 100%; padding: 13px;
    background: var(--brand); color: #fff;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    font-family: var(--sans); cursor: pointer;
    transition: all 0.15s; margin-top: auto;
  }
  .generate-btn:hover {
    background: #0F6E58;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(13,92,74,0.25);
  }

  /* ── Right Preview ── */
  .preview-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 36px 28px; gap: 18px; overflow-y: auto;
  }
  .preview-hint {
    font-size: 11px; color: var(--muted);
    font-family: var(--mono); letter-spacing: 0.06em;
    align-self: flex-start;
  }

  /* ── Card ── */
  .card {
    width: 360px; height: 360px;
    border-radius: 18px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 16px 48px rgba(0,0,0,0.18);
    transition: transform 0.2s;
  }
  .theme-dark  { background: #0D5C4A; padding: 26px; }
  .theme-light { background: #F7F9F8; padding: 26px; border: 1px solid #E2EAE7; }
  .theme-night { background: #0A0F0E; padding: 26px; }
  .theme-warm  { background: linear-gradient(135deg,#1A3C34 0%,#0D5C4A 100%); padding: 26px; }

  .bg-geo {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,160,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,160,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .theme-light .bg-geo {
    background-image:
      linear-gradient(rgba(13,92,74,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,92,74,0.04) 1px, transparent 1px);
  }
  .bg-circle {
    position: absolute; width: 260px; height: 260px; border-radius: 50%;
    border: 1px solid rgba(0,229,160,0.1); top: -70px; right: -70px;
  }
  .bg-blob {
    position: absolute; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,160,0.12) 0%, transparent 70%);
    bottom: -30px; right: -20px;
  }
  .theme-night .bg-blob {
    background: radial-gradient(ellipse at top right, rgba(0,229,160,0.07) 0%, transparent 60%);
    inset: 0; width: 100%; height: 100%; bottom: auto; right: auto; border-radius: 0;
  }

  .card-inner {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card-brand { display: flex; align-items: center; gap: 6px; }
  .card-brand-mark {
    width: 20px; height: 20px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 8px; font-weight: 500;
  }
  .card-brand-name { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  .card-date { font-family: var(--mono); font-size: 9px; text-align: right; line-height: 1.6; opacity: 0.45; }

  .card-center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 12px 0 6px; }
  .card-icon-wrap {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px; font-size: 20px;
  }
  .card-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; }

  /* EDITABLE headline */
  .card-headline {
    font-family: var(--serif); font-size: 21px; font-style: italic;
    line-height: 1.25; margin-bottom: 4px;
    outline: none; border-radius: 4px; padding: 2px 4px; margin-left: -4px;
    transition: background 0.15s;
    white-space: pre-wrap; word-break: break-word;
  }
  .card-headline:focus { background: rgba(255,255,255,0.08); }
  .theme-light .card-headline:focus { background: rgba(0,0,0,0.04); }

  .edit-hint {
    font-size: 9px; font-family: var(--mono);
    opacity: 0; transition: opacity 0.2s;
    margin-top: 2px;
  }
  .card-headline:focus ~ .edit-hint { opacity: 0.5; }

  .card-sub { font-family: var(--mono); font-size: 9px; opacity: 0.38; letter-spacing: 0.04em; }

  .card-stats { display: flex; gap: 0; margin-top: 10px; }
  .card-stat {
    flex: 1; display: flex; flex-direction: column; gap: 2px;
    padding-right: 10px; border-right: 1px solid rgba(255,255,255,0.1);
    margin-right: 10px;
  }
  .card-stat:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .theme-light .card-stat { border-right-color: rgba(0,0,0,0.08); }
  .stat-n { font-family: var(--mono); font-size: 15px; font-weight: 500; line-height: 1; }
  .stat-l { font-size: 9px; font-family: var(--mono); opacity: 0.38; line-height: 1.3; }

  .card-bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .card-module { display: flex; flex-direction: column; gap: 2px; }
  .card-module-label { font-size: 9px; font-family: var(--mono); opacity: 0.3; letter-spacing: 0.06em; text-transform: uppercase; }
  .card-module-name { font-size: 13px; font-weight: 600; }
  .card-seal {
    display: flex; align-items: center; gap: 4px;
    border-radius: 100px; padding: 4px 10px;
  }
  .seal-dot { width: 4px; height: 4px; border-radius: 50%; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .seal-txt { font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Theme color tokens */
  .theme-dark  .card-brand-mark, .theme-night .card-brand-mark, .theme-warm .card-brand-mark { background: var(--accent); color: var(--brand); }
  .theme-light .card-brand-mark { background: var(--brand); color: var(--accent); }
  .theme-dark  .card-brand-name, .theme-night .card-brand-name, .theme-warm .card-brand-name { color: rgba(255,255,255,0.45); }
  .theme-light .card-brand-name { color: var(--muted); }
  .theme-light .card-date { color: var(--text); }
  .theme-dark  .card-tag, .theme-night .card-tag, .theme-warm .card-tag { color: var(--accent); }
  .theme-light .card-tag { color: var(--brand); }
  .theme-dark  .card-headline, .theme-night .card-headline, .theme-warm .card-headline { color: #fff; }
  .theme-light .card-headline { color: var(--text); }
  .theme-dark  .card-icon-wrap { border: 2px solid var(--accent); background: rgba(0,229,160,0.1); }
  .theme-night .card-icon-wrap { border: 2px solid rgba(0,229,160,0.35); background: rgba(0,229,160,0.06); }
  .theme-warm  .card-icon-wrap { border: 2px solid var(--accent); background: rgba(0,229,160,0.12); }
  .theme-light .card-icon-wrap { border: 2px solid var(--brand); background: rgba(13,92,74,0.06); }
  .theme-dark  .stat-n, .theme-night .stat-n, .theme-warm .stat-n { color: var(--accent); }
  .theme-light .stat-n { color: var(--brand); }
  .theme-dark  .card-module-name, .theme-night .card-module-name, .theme-warm .card-module-name { color: rgba(255,255,255,0.9); }
  .theme-light .card-module-name { color: var(--text); }
  .theme-dark  .card-seal, .theme-night .card-seal, .theme-warm .card-seal { background: rgba(0,229,160,0.12); border: 1px solid rgba(0,229,160,0.25); }
  .theme-light .card-seal { background: rgba(13,92,74,0.08); border: 1px solid rgba(13,92,74,0.2); }
  .theme-dark  .seal-dot, .theme-night .seal-dot, .theme-warm .seal-dot { background: var(--accent); }
  .theme-light .seal-dot { background: var(--brand); }
  .theme-dark  .seal-txt, .theme-night .seal-txt, .theme-warm .seal-txt { color: var(--accent); }
  .theme-light .seal-txt { color: var(--brand); }
  .theme-light .edit-hint { color: var(--brand); }
  .theme-dark  .edit-hint, .theme-night .edit-hint, .theme-warm .edit-hint { color: rgba(255,255,255,0.5); }

  /* Shuffle btn */
  .shuffle-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(13,92,74,0.05);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .shuffle-row:hover { border-color: var(--brand); background: rgba(13,92,74,0.08); }
  .shuffle-icon { font-size: 14px; }
  .shuffle-text { font-size: 12px; color: var(--brand); font-weight: 500; }
  .shuffle-sub { font-size: 10px; color: var(--muted); margin-left: auto; font-family: var(--mono); }

  .save-btn {
    padding: 10px 24px; background: var(--brand); color: #fff;
    border: none; border-radius: 8px; font-size: 13px; font-weight: 500;
    font-family: var(--sans); cursor: pointer; transition: all 0.15s;
  }
  .save-btn:hover { background: #0F6E58; }

  .card.bounce { animation: bounce 0.25s ease; }
  @keyframes bounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-header">
    <div class="brand-mark">PL</div>
    <div>
      <div class="panel-title">朋友圈生成器</div>
      <div class="panel-sub">选好，点生成，随时改</div>
    </div>
  </div>

  <div class="control-group">
    <div class="control-label">完成了什么</div>
    <input class="text-input" id="moduleInput" type="text" placeholder="例：购物车结算逻辑" value="用户登录模块">
  </div>

  <div class="control-group">
    <div class="control-label">发给谁看</div>
    <div class="option-grid">
      <button class="option-btn active" data-group="audience" data-val="girlfriend"><span class="opt-icon">💕</span>女朋友</button>
      <button class="option-btn" data-group="audience" data-val="boss"><span class="opt-icon">💼</span>老板</button>
      <button class="option-btn" data-group="audience" data-val="peer"><span class="opt-icon">👨‍💻</span>同行</button>
      <button class="option-btn" data-group="audience" data-val="self"><span class="opt-icon">✨</span>自我满足</button>
    </div>
  </div>

  <div class="control-group">
    <div class="control-label">今天的状态</div>
    <div class="option-grid">
      <button class="option-btn active" data-group="mood" data-val="satisfied"><span class="opt-icon">😌</span>踏实</button>
      <button class="option-btn" data-group="mood" data-val="proud"><span class="opt-icon">🔥</span>有点燃</button>
      <button class="option-btn" data-group="mood" data-val="tired"><span class="opt-icon">😪</span>累但值</button>
      <button class="option-btn" data-group="mood" data-val="focused"><span class="opt-icon">🎯</span>专注</button>
    </div>
  </div>

  <div class="divider-line"></div>

  <div class="control-group">
    <div class="control-label">卡片风格</div>
    <div class="style-row">
      <div class="style-swatch swatch-dark active" data-theme="dark" title="深绿"></div>
      <div class="style-swatch swatch-light" data-theme="light" title="极简白"></div>
      <div class="style-swatch swatch-night" data-theme="night" title="暗夜"></div>
      <div class="style-swatch swatch-warm" data-theme="warm" title="深森"></div>
    </div>
  </div>

  <div class="shuffle-row" onclick="shuffleHeadline()">
    <div class="shuffle-icon">🎲</div>
    <div class="shuffle-text">换一句话</div>
    <div class="shuffle-sub">随机语义库</div>
  </div>

  <button class="generate-btn" onclick="generateCard()">生成卡片</button>
</div>

<!-- Preview -->
<div class="preview-area">
  <div class="preview-hint">预览 · 点击文字可直接修改</div>

  <div class="card theme-dark" id="card">
    <div class="bg-geo"></div>
    <div class="bg-circle"></div>
    <div class="bg-blob"></div>
    <div class="card-inner">
      <div class="card-top">
        <div class="card-brand">
          <div class="card-brand-mark">PL</div>
          <div class="card-brand-name">Progee Lite</div>
        </div>
        <div class="card-date" id="cardDate"></div>
      </div>
      <div class="card-center">
        <div class="card-icon-wrap" id="cardIcon">💕</div>
        <div class="card-tag" id="cardTag">✓ 功能已验证交付</div>
        <div class="card-headline" id="cardHeadline" contenteditable="true" spellcheck="false">今天加班，但这个功能稳了</div>
        <div class="edit-hint">↑ 点击可以修改文字</div>
        <div class="card-sub" id="cardSub">Verified · 你别担心我</div>
        <div class="card-stats">
          <div class="card-stat"><div class="stat-n">3/3</div><div class="stat-l">场景<br>通过</div></div>
          <div class="card-stat"><div class="stat-n">253ms</div><div class="stat-l">平均<br>响应</div></div>
          <div class="card-stat"><div class="stat-n">100%</div><div class="stat-l">契约<br>覆盖</div></div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="card-module">
          <div class="card-module-label">已交付模块</div>
          <div class="card-module-name" id="cardModule">用户登录模块</div>
        </div>
        <div class="card-seal"><div class="seal-dot"></div><div class="seal-txt">Sealed</div></div>
      </div>
    </div>
  </div>

  <button class="save-btn">保存图片 · 发朋友圈</button>
</div>

<script>
  // ── Date ──
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('cardDate').innerHTML =
    `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}<br>${pad(now.getHours())}:${pad(now.getMinutes())}`;

  // ── Semantic Library ──
  // Each entry: { icon, tag, headlines: [...], sub }
  // headlines is an ARRAY — we pick one randomly
  const library = {
    girlfriend: {
      satisfied: {
        icon: '💕',
        tag: '✓ 功能已验证交付',
        headlines: [
          '今天加班，\n但这个功能稳了',
          '熬夜也值了，\n这个跑过了',

          '今晚做了一件\n有证明的事',
          '搞定了，\n有报告为证',
          '这次交出去的\n东西我放心',
        ],
        sub: 'Verified · 你别担心我',
      },
      proud: {
        icon: '🔥',
        tag: '✓ 又拿下一个',
        headlines: [
          '一个人搞定了，\n等你夸',
          '这个难点，\n今天解决了',
          '别人靠感觉，\n我有验证报告',
          '又一个功能，\n有证据地拿下了',
          '今天效率很高，\n你猜猜做了什么',
        ],
        sub: 'Sealed · 等你夸我',
      },
      tired: {
        icon: '😌',
        tag: '✓ 今晚收工',
        headlines: [
          '累，但交出去\n的东西是干净的',
          '熬完了，\n这次没有遗憾',
          '今晚加班也值了，\n功能验证通过',
          '做完了，\n可以睡了',
          '辛苦也好过\n出了问题再返工',
        ],
        sub: 'ODD certified · 回家了',
      },
      focused: {
        icon: '🎯',
        tag: '✓ 专注出成果',
        headlines: [
          '今天没分心，\n一个功能，做完做好',
          '手机都没看，\n这个就出来了',
          '专注的两小时\n比摸鱼的一天强',
          '进入状态的感觉\n就是这样',
        ],
        sub: 'Verified & sealed',
      },
    },

    boss: {
      satisfied: {
        icon: '✅',
        tag: '✓ 交付物已验证',
        headlines: [
          '用户登录模块\n验证通过，可上线',
          '今日交付，\n验证报告已出',
          '所有场景通过，\n可以提审了',
          '功能完成，\n有据可查',
          '按时按质，\n报告已封存',
        ],
        sub: 'All scenarios passed · ODD certified',
      },
      proud: {
        icon: '📊',
        tag: '✓ 质量有据可查',
        headlines: [
          '3个场景，100%覆盖\n有报告可存档',
          '不是感觉没问题，\n是验证过没问题',
          '这次交付\n附带完整证据链',
          '代码可以换，\n验证结果封存了',
        ],
        sub: 'Evidence sealed · Ready to review',
      },
      tired: {
        icon: '🛡️',
        tag: '✓ 今日交付',
        headlines: [
          '功能完成，\n验证通过，报告已出',
          '加班也要有\n可交付的东西',
          '今天的成果\n有报告为证',
          '晚了，\n但东西是对的',
        ],
        sub: 'Verified · Sealed · Delivered',
      },
      focused: {
        icon: '🔒',
        tag: '✓ 封存完毕',
        headlines: [
          '今日任务完成\n所有验收条件通过',
          '契约已履行，\n结果已封存',
          '按契约交付，\n无遗漏',

  let state = { audience: 'girlfriend', mood: 'satisfied', theme: 'dark' };
  let currentHeadlineIndex = 0;

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateCard() {
    const card = document.getElementById('card');
    const entry = library[state.audience][state.mood];
    const moduleName = document.getElementById('moduleInput').value || '功能模块';

    card.className = `card theme-${state.theme}`;

    document.getElementById('cardIcon').textContent = entry.icon;
    document.getElementById('cardTag').textContent = entry.tag;

    const headline = pickRandom(entry.headlines);
    document.getElementById('cardHeadline').textContent = headline;

    document.getElementById('cardSub').textContent = entry.sub;
    document.getElementById('cardModule').textContent = moduleName;

    card.classList.remove('bounce');
    void card.offsetWidth;
    card.classList.add('bounce');
  }

  function shuffleHeadline() {
    const entry = library[state.audience][state.mood];
    const current = document.getElementById('cardHeadline').textContent;
    const others = entry.headlines.filter(h => h !== current);
    if (others.length === 0) return;
    const next = pickRandom(others);
    document.getElementById('cardHeadline').textContent = next;

    const card = document.getElementById('card');
    card.classList.remove('bounce');
    void card.offsetWidth;
    card.classList.add('bounce');
  }

  // Options
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[group] = btn.dataset.val;
    });
  });

  // Swatches
  document.querySelectorAll('.style-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.style-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      state.theme = sw.dataset.theme;
      document.getElementById('card').className = `card theme-${state.theme}`;
    });
  });

  // Init
  generateCard();
